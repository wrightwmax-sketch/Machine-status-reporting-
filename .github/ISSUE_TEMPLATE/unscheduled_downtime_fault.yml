name: "🚨 Machine Condition / Unscheduled Downtime Fault Report"
description: "Report broken tooling, machine alarms, safety hazards, or LOTO lockouts from the shop floor."
title: "[FAULT] "
labels: ["machine-fault", "shop-portal-sync"]
body:
  - type: markdown
    attributes:
      value: |
        ### Student Projects Laboratory (930 Kinnear Rd) — Machine Condition & Fault Ticket
        Submitting this ticket automatically updates the live shop portal status board (`data/equipment_master.json`) and logs the event in `data/pm_history.json`.
        **For severe hazards or LOTO lockouts, also notify Max Wright immediately via Microsoft Teams or Text Message.**

  - type: input
    id: asset_id
    attributes:
      label: "Asset ID"
      description: "Workstation Asset ID (e.g., MAC-01, CNC-02, WLD-01, SAW-02, FAB-01)"
      placeholder: "MAC-01"
    validations:
      required: true

  - type: dropdown
    id: student_team
    attributes:
      label: "Student Team / Course Affiliation"
      options:
        - "Formula Buckeyes"
        - "Baja Engineering"
        - "Buckeye Current"
        - "Advanced Vehicle Team"
        - "Venturi"
        - "DBR"
        - "Buckeye Experimental Aeronautics (BExA)"
        - "Experimental Methods Course"
        - "Shop Staff / SRA"
    validations:
      required: true

  - type: dropdown
    id: severity_status
    attributes:
      label: "Machine Condition / Severity Level"
      options:
        - "DOWN - LOCKED OUT (Red Tag / Do Not Operate)"
        - "DEGRADED / CAUTION (Yellow Tag / Needs Tooling or Minor Attention)"
        - "OPERATIONAL (Cleared / Returned to Service)"
    validations:
      required: true

  - type: input
    id: reporter
    attributes:
      label: "Reporter Name & Email"
      placeholder: "Alex Smith (smith.1@example.edu)"
    validations:
      required: true

  - type: textarea
    id: fault_description
    attributes:
      label: "Fault Description, Broken Tooling, or Alarm Code"
      description: "Describe exactly what happened, any abnormal noises/alarms, and whether a physical LOTO padlock was applied."
      placeholder: "Broken 1/2\" endmill in collet; spindle stopped immediately."
    validations:
      required: true

  - type: checkboxes
    id: safety_acknowledgement
    attributes:
      label: "Safety & LOTO Protocol Verification"
      options:
        - label: "If the machine is unsafe to operate, I have turned off the machine and notified Max Wright (Teams / Text Message) or an SRA on duty."
          required: true
